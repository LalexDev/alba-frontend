<div
  class="layout"
  [class.sidebar-open]="sidebarOpen"
>
  <!-- MENÚ LATERAL -->
  <aside
    class="sidebar"
    [class.open]="sidebarOpen"
  >
    <div class="brand">
      <div class="brand-icon">
        <i class="bi bi-eyeglasses"></i>
      </div>

      <div class="brand-text">
        <img
          class="brand-title-logo"
          src="/assets/logo-optica-alba.png"
          alt="Óptica Alba"
        />
        <span>Sistema para ópticas</span>
      </div>

      <button
        class="sidebar-close"
        type="button"
        aria-label="Cerrar menú"
        (click)="closeSidebar()"
      >
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="user-card">
      <strong>{{ userLabel }}</strong>
      <span>{{ role }}</span>
    </div>

    <nav class="nav">
      <a
        *ngFor="let item of visibleItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        (click)="closeSidebar()"
      >
        <span class="nav-icon">
          <i [class]="item.icon"></i>
        </span>

        <span class="nav-label">
          {{ item.label }}
        </span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button
        class="btn secondary full"
        type="button"
        (click)="logout()"
      >
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- FONDO OSCURO EN TABLET Y CELULAR -->
  <button
    class="sidebar-backdrop"
    type="button"
    aria-label="Cerrar menú"
    [class.visible]="sidebarOpen"
    (click)="closeSidebar()"
  ></button>

  <!-- CONTENIDO PRINCIPAL -->
  <section class="content">

    <!-- BOTÓN RESPONSIVE PARA ABRIR EL MENÚ -->
    <button
      class="mobile-menu global-mobile-menu no-print"
      type="button"
      aria-label="Abrir menú"
      (click)="toggleSidebar()"
    >
      <i class="bi bi-list"></i>
    </button>

    <!-- CONTENIDO DE CADA PÁGINA -->
    <div class="route-content">
      <router-outlet></router-outlet>
    </div>

  </section>
</div>
