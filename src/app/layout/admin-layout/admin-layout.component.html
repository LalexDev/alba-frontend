<div
  class="layout"
  [class.sidebar-open]="sidebarOpen"
>
  <!-- MENÚ LATERAL -->
  <aside
    class="sidebar"
    [class.open]="sidebarOpen"
  >
    <div class="brand">
      <div class="brand-icon">
        👓
      </div>

      <div class="brand-text">
        <h2>Óptica Alba</h2>
        <span>Sistema para ópticas</span>
      </div>

      <button
        class="sidebar-close"
        type="button"
        aria-label="Cerrar menú"
        (click)="closeSidebar()"
      >
        ×
      </button>
    </div>

    <div class="user-card">
      <strong>{{ userLabel }}</strong>
      <span>{{ role }}</span>
    </div>

    <nav class="nav">
      <a
        *ngFor="let item of visibleItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        (click)="closeSidebar()"
      >
        <span class="emoji">
          {{ item.icon }}
        </span>

        <span class="nav-label">
          {{ item.label }}
        </span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button
        class="btn secondary full"
        type="button"
        (click)="logout()"
      >
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- FONDO OSCURO EN TABLET Y CELULAR -->
  <button
    class="sidebar-backdrop"
    type="button"
    aria-label="Cerrar menú"
    [class.visible]="sidebarOpen"
    (click)="closeSidebar()"
  ></button>

  <!-- CONTENIDO PRINCIPAL -->
  <section class="content">

    <!-- BOTÓN RESPONSIVE PARA ABRIR EL MENÚ -->
    <button
      class="mobile-menu global-mobile-menu no-print"
      type="button"
      aria-label="Abrir menú"
      (click)="toggleSidebar()"
    >
      ☰
    </button>

    <!-- CONTENIDO DE CADA PÁGINA -->
    <div class="route-content">
      <router-outlet></router-outlet>
    </div>

  </section>
</div>
